<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song Request Queue</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Yatra+One&display=swap" rel="stylesheet">
  <!-- QR generator; the code always points at whatever address this site is deployed to -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --bg: #14081f; --text: #fff6ea; --muted: #c9b2d3; --accent: #ffc23d; }
    body { text-align: center; padding-top: 36px; background: radial-gradient(120% 80% at 50% 0%, #2a0f3d 0%, #14081f 60%); min-height: 100vh; }
    .party { font-family: "Yatra One", Georgia, serif; color: var(--accent); font-size: 1.25rem; }
    .title { font-family: "Bricolage Grotesque", system-ui, sans-serif; font-weight: 800; font-size: 2.6rem;
      line-height: 1.05; letter-spacing: -.02em; margin: 10px 0 4px; }
    .dj { font-weight: 700; color: var(--accent); letter-spacing: .14em; text-transform: uppercase; font-size: .9rem; }
    #qr { display: inline-block; padding: 18px; background: #fff; border-radius: 20px; margin: 22px 0 14px; }
    #qr img, #qr canvas { display: block; width: 300px; height: 300px; }
    .steps { color: var(--muted); font-size: 1.05rem; }
    .steps b { color: var(--text); }
    .getit { display: inline-flex; align-items: center; gap: 8px; margin-top: 26px; color: var(--muted); font-size: .72rem; text-align: left; line-height: 1.3; opacity: .8; }
    #repoQr { background: #fff; padding: 3px; border-radius: 4px; }
    #repoQr img, #repoQr canvas { display: block; width: 52px !important; height: 52px !important; }
    @media print {
      body { background: #fff; }
      :root { --text: #000; --muted: #333; --accent: #a34a00; }
      .noprint { display: none; }
    }
  </style>
</head>
<body>
  <div class="party" id="party">&nbsp;</div>
  <div class="title" id="queueTitle">Song Request Queue</div>
  <div class="dj" id="dj">&nbsp;</div>
  <div id="qr"></div>
  <div class="steps"><b>Scan</b> · pick a song · add a dedication 💌</div>
  <p class="sub" style="margin-top:6px">No app or login needed.</p>
  <p class="noprint" style="margin-top:22px"><button class="go" onclick="print()">Print poster</button></p>

  <!-- Very small QR for people who want this app for their own party (not for song requests) -->
  <div class="getit">
    <div id="repoQr"></div>
    <div>Want this for your party?<br>Scan for the free app</div>
  </div>

<script>
// The QR code opens the guest page on this same site. The address itself isn't printed.
new QRCode(document.getElementById('qr'), {
  text: location.origin + '/', width: 600, height: 600,   // drawn large, shown at 300px for crisp printing
  colorDark: '#000000', colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.M,
});
// Headline split over two lines on the last two words ("Diwali Song / Request Queue").
function setTitle(t) {
  const words = t.split(' '), el = document.getElementById('queueTitle');
  el.replaceChildren();
  const cut = Math.max(1, words.length - 2);
  el.append(words.slice(0, cut).join(' '));
  if (words.length > 2) { el.append(document.createElement('br')); el.append(words.slice(cut).join(' ')); }
}
// Tiny QR to the GitHub repo.
function drawRepoQr(url) {
  const box = document.getElementById('repoQr');
  box.replaceChildren();
  new QRCode(box, { text: url, width: 200, height: 200, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.L });
}
fetch('/api/nowplaying').then((r) => r.json()).then((d) => {
  if (d.partyName) document.getElementById('party').textContent = `🪔 ${d.partyName} 🪔`;
  if (d.djName) document.getElementById('dj').textContent = `with ${d.djName}`;
  if (d.queueTitle) { setTitle(d.queueTitle); document.title = d.queueTitle; }
  drawRepoQr(d.repoUrl || 'https://github.com/dys2806/dj-darshan');
}).catch(() => drawRepoQr('https://github.com/dys2806/dj-darshan'));
</script>
</body>
</html>
