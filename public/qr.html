<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DJ Darshan · Scan to Request</title>
  <link rel="stylesheet" href="/style.css">
  <!-- QR generator; the code always points at whatever URL this site is deployed to -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { text-align: center; padding-top: 40px; }
    .big { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; margin: 8px 0; }
    #qr { display: inline-block; padding: 18px; background: #fff; border-radius: 20px; margin: 20px 0; }
    #qr img, #qr canvas { display: block; width: 300px; height: 300px; }
    .url { color: var(--muted); font-size: 1rem; word-break: break-all; }
    @media print {
      :root { --bg: #fff; --text: #000; --muted: #444; --accent: #000; }
      .noprint { display: none; }
    }
  </style>
</head>
<body>
  <div class="eyebrow" id="party" style="font-size:1rem;letter-spacing:.06em;text-transform:none">🪔 Himanshu and Kirti’s Diwali Party 🪔</div>
  <div style="font-size:1.4rem;font-weight:800;margin-top:6px" id="dj">DJ Darshan</div>
  <div class="big">🎵 Scan to add a song</div>
  <p class="sub">No app or login needed.</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <p class="noprint" style="margin-top:28px"><button class="go" onclick="print()">Print poster</button></p>

<script>
// The guest page lives at the root of this same site.
const target = location.origin + '/';
document.getElementById('url').textContent = target.replace(/^https?:\/\//, '').replace(/\/$/, '');
new QRCode(document.getElementById('qr'), {
  text: target, width: 600, height: 600,          // drawn large, displayed at 300px for crisp printing
  colorDark: '#000000', colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.M,
});
fetch('/api/nowplaying').then((r) => r.json()).then((d) => {
  if (d.partyName) document.getElementById('party').textContent = `🪔 ${d.partyName} 🪔`;
  if (d.djName) document.getElementById('dj').textContent = d.djName;
}).catch(() => {});
</script>
</body>
</html>
